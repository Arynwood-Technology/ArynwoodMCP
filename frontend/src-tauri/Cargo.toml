[package]
name = "arynwood"
version = "0.4.2"
description = "Arynwood MCP Desktop"
authors = []
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"

# WebKitGTK denies every getUserMedia() request by default (no built-in
# permission-prompt UI) unless the app hooks the "permission-request" signal
# itself — see main.rs. Version pinned to match what wry already resolves.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
webkit2gtk = "2.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
