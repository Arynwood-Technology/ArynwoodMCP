name: Deploy Demo

# Builds the frontend in demo mode (mocked data, no real backend — see
# frontend/src/lib/demo/) and publishes it to GitHub Pages. Secret-free, scrubbed
# marketing/portfolio surface — auto-deploy on merge is the normal, low-risk default
# here. The real safeguard against shipping a *broken* demo is `npm run build:demo`
# also running in ci.yml on every PR, so a break fails CI before merge rather than
# after a live deploy.
#
# One-time setup this workflow can't do itself: repo Settings -> Pages -> Build and
# deployment -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read          # configure-pages reads the site's Pages settings
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build:demo
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write         # publishes the demo
      id-token: write      # proves to Pages that this run is the deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
