name: Deploy Demo

# Builds the frontend in demo mode (mocked data, no real backend — see
# frontend/src/lib/demo/) and publishes it to GitHub Pages. Secret-free, scrubbed
# marketing/portfolio surface — auto-deploy on merge is the normal, low-risk default
# here. The real safeguard against shipping a *broken* demo is `npm run build:demo`
# also running in ci.yml on every PR, so a break fails CI before merge rather than
# after a live deploy.
#
# One-time setup this workflow can't do itself: repo Settings -> Pages -> Build and
# deployment -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build:demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
