name: Windows desktop
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write      # tag builds attest the installer with this run's GitHub identity
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: python -m pip install -r requirements-dev.txt pyinstaller
      - run: python -m pytest tests/test_windows_platform.py -q
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - name: Package and smoke-test
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Python (Get-Command python).Source
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: frontend/src-tauri/target/release/bundle/nsis/*-setup.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arynwood-windows-x64
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*-setup.exe
            frontend/src-tauri/target/release/bundle/nsis/SHA256SUMS-windows.txt
          if-no-files-found: error
