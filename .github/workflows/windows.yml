name: Windows desktop
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -r requirements-dev.txt pyinstaller
      - run: python -m pytest tests/test_windows_platform.py -q
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - name: Package and smoke-test
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Python (Get-Command python).Source
      - uses: actions/upload-artifact@v4
        with:
          name: arynwood-windows-x64
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*-setup.exe
            frontend/src-tauri/target/release/bundle/nsis/SHA256SUMS-windows.txt
          if-no-files-found: error
