name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      # Catches a break in the GitHub Pages demo build (frontend/src/lib/demo/) before
      # it merges — deploy-demo.yml deploys on every push to main with no other gate.
      - run: npm run build:demo
      - run: npm test
      # Fails only on a regression past the tracked baseline (frontend/.eslint-baseline),
      # not on the pre-existing baseline itself — see that script's own comment and
      # CLAUDE.md. A tag release can no longer succeed while this is silently red.
      - run: node scripts/check-lint-baseline.mjs
