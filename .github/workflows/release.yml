name: Release (Linux)

# Builds Linux desktop artifacts (AppImage + .deb) on a semver tag push, computes
# SHA-256 checksums, and publishes a draft GitHub Release with notes pulled from
# CHANGELOG.md. No code-signing/notarization step — this environment has no signing
# keys/certs. Add one later as a separate step once real signing credentials exist;
# don't add a signing step that silently no-ops without them.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install -r requirements.txt pyinstaller

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
          # GStreamer: WebKitGTK plays audio/video and records through it, and the AppImage
          # only carries what is staged below (see the "Stage GStreamer plugins" step).
          sudo apt-get install -y gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-pulseaudio

      # Backend sidecar: bundled as a standalone binary and placed where Tauri's
      # `externalBin` config (frontend/src-tauri/tauri.conf.json) expects it. See
      # docs/release-readiness-audit.md §3 for why this step exists at all — the
      # packaged desktop app can't just spawn `python3` the way dev launchers do.
      - name: Build backend sidecar
        run: |
          pyinstaller arynwood-backend.spec
          mkdir -p frontend/src-tauri/binaries
          cp dist/arynwood-backend frontend/src-tauri/binaries/arynwood-backend-x86_64-unknown-linux-gnu

      # The release gate from CLAUDE.md: runs the frozen binary under an AppImage-style
      # environment (isolated port + data dir, fake sidecar). Unit tests can't see the
      # failures this catches — every packaged-only bug found so far was invisible until a
      # real binary ran. A failure here stops the release before anything is bundled.
      - name: Smoke-test the frozen backend
        run: python scripts/smoke_packaged_backend.py dist/arynwood-backend

      # Without this, `bundleMediaFramework` copies every plugin on the runner (hundreds,
      # plus VA-API/CUDA/WebRTC dependencies), and an AppImage with none at all has no audio
      # sink — the window goes grey on the first <audio> element. This stages the ~40 plugins
      # a web view uses; fails if a required one is missing rather than shipping without it.
      - name: Stage GStreamer plugins
        run: |
          eval "$(scripts/stage_gstreamer_plugins.sh "$RUNNER_TEMP/gst-plugins")"
          echo "GSTREAMER_PLUGINS_DIR=$GSTREAMER_PLUGINS_DIR" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            BEGIN{found=0}
            /^## \[/{ if (found) exit; if ($0 ~ "\\[" ver "\\]" || $0 ~ "\\[Unreleased\\]") found=1; next }
            found{print}
          ' CHANGELOG.md > release-notes.md
          echo "Extracted notes:"; cat release-notes.md
          # tauri-action@v0 has no releaseBodyFile input (only releaseBody, a plain
          # string) — pass the extracted notes through a GITHUB_OUTPUT multiline
          # value instead of a file path.
          delimiter="$(openssl rand -hex 8)"
          echo "body<<$delimiter" >> "$GITHUB_OUTPUT"
          cat release-notes.md >> "$GITHUB_OUTPUT"
          echo "$delimiter" >> "$GITHUB_OUTPUT"

      - name: Build Tauri bundles (AppImage + .deb)
        uses: tauri-apps/tauri-action@v0
        env:
          # linuxdeploy/appimagetool (which AppImage bundling shells out to) are
          # themselves distributed as AppImages that need to mount via FUSE to
          # run — GitHub's runners often can't load the FUSE kernel module even
          # with libfuse2 installed (containerized/sandboxed), so this makes them
          # self-extract and run instead of mounting. Standard fix for this exact
          # failure mode, not specific to anything in this repo.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          projectPath: frontend
          args: --bundles appimage,deb
          releaseDraft: true
          releaseBody: ${{ steps.notes.outputs.body }}

      - name: Generate SHA-256 checksums
        run: |
          cd frontend/src-tauri/target/release/bundle
          find . -type f \( -name "*.AppImage" -o -name "*.deb" \) -exec sha256sum {} \; > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload checksums to the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: frontend/src-tauri/target/release/bundle/SHA256SUMS.txt
