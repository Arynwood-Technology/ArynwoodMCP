name: Verify release artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag
        required: true
        type: string
      linux_run_id:
        description: Successful tagged Linux release workflow run
        required: true
        type: string
      windows_run_id:
        description: Successful tagged Windows desktop workflow run
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      attestations: read
      contents: write      # attaches the verified files to the draft release
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      LINUX_RUN_ID: ${{ inputs.linux_run_id }}
      WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify artifact provenance and draft status
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$LINUX_RUN_ID" =~ ^[0-9]+$ && "$WINDOWS_RUN_ID" =~ ^[0-9]+$ ]]
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          for entry in "$LINUX_RUN_ID:Release (Linux)" "$WINDOWS_RUN_ID:Windows desktop"; do
            run_id=${entry%%:*}
            run_name=${entry#*:}
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$RUNNER_TEMP/run.json"
            jq -e --arg tag "$RELEASE_TAG" --arg sha "$tag_sha" --arg name "$run_name" \
              '.conclusion == "success" and .event == "push" and .head_branch == $tag and .head_sha == $sha and .name == $name' \
              "$RUNNER_TEMP/run.json"
          done
          gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft | grep -x true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-desktop
          run-id: ${{ inputs.linux_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arynwood-windows-x64
          run-id: ${{ inputs.windows_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/windows
      - name: Verify checksums and package versions
        shell: bash
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          # upload-artifact preserves the Linux appimage/deb subdirectories.
          find artifacts/linux -mindepth 2 -type f \( -name '*.AppImage' -o -name '*.deb' \) -exec mv -t artifacts/linux {} +
          (cd artifacts/linux && sha256sum -c SHA256SUMS.txt)
          (cd artifacts/windows && tr -d '\r' < SHA256SUMS-windows.txt | sha256sum -c -)
          test "$(dpkg-deb -f "artifacts/linux/arynwood-mcp_${version}_amd64.deb" Version)" = "$version"
          test -f "artifacts/windows/arynwood-mcp_${version}_x64-setup.exe"
          cat artifacts/linux/SHA256SUMS.txt artifacts/windows/SHA256SUMS-windows.txt | tr -d '\r' > artifacts/SHA256SUMS-all.txt
      # Releases from 0.5.4 on: every package must carry an attestation made by this repository's
      # workflows from the tag being released, on a GitHub-hosted runner.
      - name: Verify build provenance attestations
        shell: bash
        run: |
          set -euo pipefail
          for f in artifacts/linux/*.AppImage artifacts/linux/*.deb artifacts/windows/*-setup.exe; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" --source-ref "refs/tags/$RELEASE_TAG" --deny-self-hosted-runners
          done
      # The same attestations as one file on the release, so a download can be checked against the
      # release itself: `gh attestation verify <package> --bundle <file>`. Each line is a Sigstore bundle
      # holding a signed SLSA provenance statement. The `.intoto.jsonl` ending is the convention that
      # tools (OpenSSF Scorecard among them) look for. Every package is checked against the file before
      # it is attached.
      - name: Collect the attestations into the release's provenance file
        shell: bash
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          provenance="$GITHUB_WORKSPACE/artifacts/arynwood-mcp_${version}_provenance.intoto.jsonl"
          packages=("$GITHUB_WORKSPACE"/artifacts/linux/*.AppImage "$GITHUB_WORKSPACE"/artifacts/linux/*.deb \
            "$GITHUB_WORKSPACE"/artifacts/windows/*-setup.exe)
          mkdir "$RUNNER_TEMP/attestations"
          cd "$RUNNER_TEMP/attestations"
          # Writes one sha256:<digest>.jsonl per package into the current folder.
          for f in "${packages[@]}"; do
            gh attestation download "$f" --repo "$GITHUB_REPOSITORY" --predicate-type https://slsa.dev/provenance/v1
          done
          # The AppImage and .deb share one attestation: keep each bundle once.
          cat ./*.jsonl | awk 'NF && !seen[$0]++' > "$provenance"
          test -s "$provenance"
          for f in "${packages[@]}"; do
            gh attestation verify "$f" --bundle "$provenance" --repo "$GITHUB_REPOSITORY" \
              --source-ref "refs/tags/$RELEASE_TAG" --deny-self-hosted-runners
          done
          echo "$(wc -l < "$provenance") attestation(s) in $(basename "$provenance")"
      - name: Install isolated verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb python3-gi gir1.2-gtk-3.0 pulseaudio \
            libegl1 libgl1 libgles2 libasound2
          # The AppImage already contains WebKitGTK and GStreamer. Fetch only GI
          # metadata instead of installing another media stack and ffmpeg.
          mkdir -p typelib-packages typelibs
          (cd typelib-packages && apt-get download gir1.2-webkit2-4.1 gir1.2-javascriptcoregtk-4.1 gir1.2-soup-3.0)
          for package in typelib-packages/*.deb; do dpkg-deb -x "$package" typelibs; done
          python3 -m pip install --require-hashes -r requirements-verify.lock
      - name: Extract and inspect the official AppImage
        shell: bash
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          chmod +x "artifacts/linux/arynwood-mcp_${version}_amd64.AppImage"
          mkdir extracted
          (cd extracted && "$GITHUB_WORKSPACE/artifacts/linux/arynwood-mcp_${version}_amd64.AppImage" --appimage-extract > extract.log)
          test -x extracted/squashfs-root/AppRun
          test -x extracted/squashfs-root/AppRun.wrapped
          GSTREAMER_PLUGINS_DIR="$GITHUB_WORKSPACE/extracted/squashfs-root/usr/lib/gstreamer-1.0" \
            scripts/stage_gstreamer_plugins.sh "$RUNNER_TEMP/verified-plugins" > /dev/null
          python3 - <<'PY'
          import re
          from PyInstaller.archive.readers import CArchiveReader
          archive = CArchiveReader('extracted/squashfs-root/usr/bin/arynwood-backend')
          forbidden = [name for name in archive.toc if re.search(
              r'(^|/)(\.env|mcp_servers\.json|personas\.local\.json|MEMORY\.md)$|\.db(?:-(?:wal|shm))?$', name)]
          assert not forbidden, forbidden
          print('PASS no private configuration, databases or memory files in frozen archive')
          PY
      - name: Smoke-test the extracted frozen backend
        env:
          SMOKE_EXPECT_VERSION: ${{ inputs.tag }}   # the release's own version, whatever this checkout is
        run: python3 scripts/smoke_packaged_backend.py extracted/squashfs-root/usr/bin/arynwood-backend
      - name: Verify bundled WebKitGTK playback and recording
        shell: bash
        run: |
          set -euo pipefail
          mkdir media
          cp tests/fixtures/release-media/a.mp3 tests/fixtures/release-media/a.mp4 media/
          python3 - <<'PY'
          import math, struct, wave
          with wave.open('media/a.wav', 'wb') as audio:
              audio.setparams((1, 2, 44100, 0, 'NONE', 'not compressed'))
              audio.writeframes(b''.join(struct.pack('<h', int(8000 * math.sin(2 * math.pi * 440 * i / 44100))) for i in range(264600)))
          PY
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/media-runtime"
          export PULSE_RUNTIME_PATH="$XDG_RUNTIME_DIR/pulse"
          export PULSE_STATE_PATH="$RUNNER_TEMP/media-pulse-state"
          export PULSE_SERVER="unix:$XDG_RUNTIME_DIR/pulse-socket"
          mkdir -p "$XDG_RUNTIME_DIR" "$PULSE_STATE_PATH"
          chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio -n --daemonize=yes --exit-idle-time=-1 --disable-shm=yes \
            -L "module-native-protocol-unix socket=$XDG_RUNTIME_DIR/pulse-socket auth-anonymous=1" \
            -L "module-null-sink sink_name=release_test" \
            -L "module-sine-source source_name=release_mic frequency=440 rate=48000"
          trap 'pactl exit' EXIT
          bundle="$GITHUB_WORKSPACE/extracted/squashfs-root"
          cd "$bundle/usr"
          xvfb-run -a env LD_LIBRARY_PATH="$bundle/usr/lib" \
            GI_TYPELIB_PATH="$GITHUB_WORKSPACE/typelibs/usr/lib/girepository-1.0:$GITHUB_WORKSPACE/typelibs/usr/lib/x86_64-linux-gnu/girepository-1.0" \
            GST_PLUGIN_SYSTEM_PATH_1_0="$bundle/usr/lib/gstreamer-1.0" \
            GST_PLUGIN_PATH_1_0="$bundle/usr/lib/gstreamer-1.0" \
            GST_PLUGIN_SCANNER_1_0="$bundle/usr/lib/gstreamer1.0/gstreamer-1.0/gst-plugin-scanner" \
            GST_REGISTRY="$RUNNER_TEMP/media-registry.bin" GST_REGISTRY_REUSE_PLUGIN_SCANNER=no \
            GST_PLUGIN_FEATURE_RANK=alsadeviceprovider:NONE,pipewiredeviceprovider:NONE,alsasrc:NONE,pipewiresrc:NONE \
            WEBKIT_DISABLE_DMABUF_RENDERER=1 python3 "$GITHUB_WORKSPACE/scripts/check_webkit_media.py" \
            "$GITHUB_WORKSPACE/media" audio:a.wav audio:a.mp3 video:a.mp4 webaudio:a.wav recorder mic
      - name: Attach verified Windows installer and provenance file to the draft release
        shell: bash
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft | grep -x true
          gh release upload "$RELEASE_TAG" artifacts/windows/*-setup.exe artifacts/windows/SHA256SUMS-windows.txt \
            "artifacts/arynwood-mcp_${version}_provenance.intoto.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release-checksums
          path: artifacts/SHA256SUMS-all.txt
